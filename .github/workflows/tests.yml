name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: helpdesk_test
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=helpdesk --cov=tools --cov-report=term-missing
      - name: PostgreSQL tests
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://helpdesk:test-password@localhost:5432/helpdesk_test
      - name: PostgreSQL migrations
        run: |
          flask --app wsgi db upgrade
          flask --app wsgi seed
          flask --app wsgi db check
        env:
          DATABASE_URL: postgresql+psycopg://helpdesk:test-password@localhost:5432/helpdesk_test
      - run: docker build -t helpdesk-test .
